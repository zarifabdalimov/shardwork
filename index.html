<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shardwork</title>
<style>
  :root { --bg:#111214; --panel:#1a1c20; --line:#2c2f36; --text:#e8e9ec; --dim:#8b8f99; --accent:#d9dde6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; display: flex; }
  aside { width: 280px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .02em; }
  h2 { font-size: 11px; margin: 8px 0 0; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  label.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  label.row output { color: var(--text); font-variant-numeric: tabular-nums; }
  label.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
  label.check, label.pick { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
  label.pick { justify-content: space-between; }
  select { background: #262930; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 12px; min-width: 130px; }
  #swatches { display: flex; flex: none; height: 18px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
  #swatches i { flex: 1; }
  #swatches:empty { display: none; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  button { background: #262930; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { background: #30343c; }
  button.wide { grid-column: 1 / -1; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); grid-column: 1 / -1; }
  button:disabled { opacity: .4; cursor: default; }
  main { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 24px; }
  canvas { max-width: 100%; max-height: 100%; display: none; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #drop { position: absolute; inset: 24px; border: 1.5px dashed var(--line); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--dim); cursor: pointer; text-align: center; }
  #drop strong { color: var(--text); font-size: 16px; font-weight: 500; }
  body.has-image #drop { display: none; }
  body.has-image canvas { display: block; }
  body.dragging main::after { content: "Drop image"; position: absolute; inset: 12px; border: 2px solid var(--accent); border-radius: 12px; background: rgba(17,18,20,.8); display: flex; align-items: center; justify-content: center; font-size: 18px; pointer-events: none; }
  .status { color: var(--dim); font-size: 11px; min-height: 14px; }
  .status.error { color: #ff8a80; }
  .hint { color: var(--dim); font-size: 11px; margin-top: auto; }
  @media (max-width: 720px) { body { flex-direction: column-reverse; } aside { width: 100%; max-height: 45%; border-right: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h1>Shardwork</h1>

  <h2>Glass</h2>
  <div id="glassControls"></div>
  <label class="pick">Pattern <select id="pattern"></select></label>
  <button id="loadPattern">Load pattern SVG…</button>
  <div id="patternStatus" class="status"></div>
  <label class="pick">Pattern fit
    <select id="fit"><option value="cover">Cover (keep shapes)</option><option value="stretch">Stretch (whole pattern)</option></select>
  </label>

  <h2>Color</h2>
  <label class="pick">Palette <select id="palette"></select></label>
  <div id="swatches"></div>
  <div id="colorControls"></div>
  <label class="check"><input type="checkbox" id="mono" checked> Black &amp; white base image</label>

  <div class="buttons">
    <button id="shuffle">Shuffle shards</button>
    <button id="shuffleColors">Shuffle colors</button>
    <button id="reset">Reset sliders</button>
    <button id="open">Open image</button>
    <button id="save" class="primary" disabled>Download PNG</button>
  </div>
  <p class="hint">Drop, paste or pick an image; drop an .svg to use it as the pattern. Everything runs in your browser — nothing is uploaded.</p>
</aside>
<main>
  <div id="drop"><strong>Drop an image here</strong><span>or click to choose · or paste from clipboard</span></div>
  <canvas id="gl"></canvas>
  <input type="file" id="file" accept="image/*" hidden>
  <input type="file" id="patternFile" accept=".svg,image/svg+xml" hidden>
</main>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;  // the user's image
uniform sampler2D uMap;  // pattern map: R = pane id, GB = pane centre, A = palette slot
uniform vec2 uRes, uFit; // uFit: canvas uv -> pattern uv scale
uniform float uSeed, uDisp, uZoomVar, uRot, uZoom, uEdge, uGrain, uTint, uMono, uColor;
uniform vec3 uPal[6];
uniform float uAspect;

float h1(float n) { return fract(sin(n * 12.9898 + uSeed * 7.233) * 43758.5453); }
vec4 pane(vec2 uv) { return texture2D(uMap, (uv - 0.5) * uFit + 0.5); }
float paneId(vec2 uv) { return floor(pane(uv).r * 255.0 + 0.5); }

void main() {
  vec4 m = pane(vUv);
  float id = floor(m.r * 255.0 + 0.5) * 7.31;
  vec2 c = (m.gb - 0.5) / uFit + 0.5;

  // each pane refracts the image with its own shift, magnification and twist
  vec2 off = (vec2(h1(id + 1.0), h1(id + 2.0)) - 0.5) * uDisp * vec2(1.0, 0.6);
  float sc = 1.0 + (h1(id + 3.0) - 0.5) * uZoomVar;
  float ang = (h1(id + 4.0) - 0.5) * uRot;
  vec2 d = vUv - c; d.x *= uAspect;
  d = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * d / sc;
  d.x /= uAspect;
  vec2 suv = (c + d + off - 0.5) / uZoom + 0.5;
  vec3 col = texture2D(uTex, suv).rgb;

  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  if (uMono > 0.5) col = vec3(lum);

  // palette: every pane is tinted with the colour of its slot
  float slot = floor(m.a * 255.0 / 40.0 + 0.5);
  vec3 pc = uPal[0];
  for (int i = 1; i < 6; i++) if (float(i) == slot) pc = uPal[i];
  col = mix(col, pc * mix(lum, 1.0, 0.12), uColor);

  // slightly different glass density per pane
  float t = (h1(id + 5.0) - 0.5) * uTint;
  col = mix(col, vec3(t > 0.0 ? 1.0 : 0.0), abs(t));

  // bevel: bright on one side of a crack, dark on the other
  vec2 px = vec2(1.2, -1.2) / uRes * max(1.0, uRes.y / 900.0);
  float raw = id / 7.31;
  if (abs(paneId(vUv + px) - raw) > 0.5) col += uEdge * 0.45;
  if (abs(paneId(vUv - px) - raw) > 0.5) col -= uEdge * 0.55;

  vec2 g = floor(gl_FragCoord.xy / max(1.0, uRes.y / 1100.0));
  float n = fract(sin(dot(g, vec2(12.9898, 78.233)) + uSeed) * 43758.5453) - 0.5;
  col += n * uGrain;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script>
// =====================================================================================
// Pattern: the geometry of the ballet mural, traced in pixel coordinates of the reference
// photo. Shapes are painted in order (later on top). Each shape is a union of parts; a
// part is an intersection of clips:
//   R(x0,y0,x1,y1) rectangle · IN(circle) inside a disc · OUT(circle) outside a disc · P(...xy) polygon
// The last number of a shape is its palette slot:
//   0 dark cool · 1 mid cool · 2 dark warm · 3 mid warm · 4 light · 5 neutral
// =====================================================================================
const BOUNDS = { x: 45, y: 28, w: 1205, h: 907 };
const PATTERN = (() => {
  const R = (x0, y0, x1, y1) => ['r', x0, y0, x1, y1];
  const IN = c => ['c', ...c], OUT = c => ['o', ...c];
  const P = (...pts) => ['p', pts];
  const C1 = [432, 352, 279];            // big left circle
  const C2 = [760, 354, 274];            // right disc (pink / pale blue / tall blue panel)
  const C2o = [761, 356, 320];           // brown ring around it
  const C2c = [763, 358, 412];           // white crescent
  const C3 = [100, 537, 208];            // dark disc, lower left
  const C4 = [52, 632, 365];             // sweep under the left circle
  const C5 = [527, 445, 264];            // arc in the lower-centre panel
  const C6 = [1045, 714, 225];           // quarter disc, bottom centre-right
  const C7 = [1262, 742, 127];           // small blue quarter, right edge
  const Q  = [690, 165, 62];             // rounded corner of the dark brown block
  const s = [];
  const S = (slot, ...parts) => s.push({ slot, parts });

  S(5, [R(-99, -99, 1400, 1100)]);                                   // safety base
  // --- top row & left column
  S(2, [R(-99, -99, 312, 123)]);
  S(4, [R(-99, 123, 312, 437)]);
  S(5, [R(312, -99, 443, 130)]);
  S(1, [R(443, -99, 752, 130)]);
  S(2, [R(752, -99, 785, 52)]);
  S(3, [R(528, 50, 785, 380)]);                                      // trunk / reddish field
  S(2, [R(528, 50, 752, 165)], [R(528, 165, 690, 227)], [R(690, 165, 752, 227), IN(Q)]);
  S(1, [R(528, 380, 785, 420)]);
  S(5, [R(528, 420, 700, 492)]);
  // --- lower left
  S(1, [R(-99, 494, 305, 742)]);
  S(0, [R(-99, 494, 305, 742), IN(C3)]);
  S(5, [R(-99, 742, 300, 767)]);
  S(3, [R(-99, 767, 435, 832), IN(C4)], [R(300, 590, 435, 767), IN(C4)]);
  S(1, [R(-99, 832, 435, 1100), IN(C4)]);
  S(4, [R(255, 590, 435, 1100), OUT(C4)]);
  // --- lower centre
  S(5, [R(435, 590, 791, 1100)]);
  S(0, [P(622, 806, 791, 806, 791, 1100, 380, 1100)]);
  S(1, [R(527, 492, 787, 714), IN(C5)]);
  S(0, [R(527, 492, 787, 714), OUT(C5)]);
  // --- big left circle
  S(5, [IN(C1), R(-99, -99, 312, 437)]);
  S(3, [IN(C1), R(312, -99, 528, 127)]);
  S(0, [IN(C1), R(312, 127, 528, 437)]);
  S(1, [IN(C1), R(308, 437, 528, 494)]);
  S(0, [IN(C1), R(305, 494, 528, 700)]);
  S(5, [IN(C1), R(-99, 494, 305, 700)]);
  S(5, [IN(C1), R(528, -99, 800, 494)]);
  S(4, [IN(C1), P(528, -99, 800, -99, 800, 196, 528, 300)]);
  S(4, [IN(C1), R(528, 494, 800, 700)]);
  S(3, [R(-99, 437, 312, 494)]);
  S(3, [R(700, 420, 785, 492)]);
  // --- right side backgrounds
  S(4, [R(785, -99, 888, 130)]);
  S(1, [R(888, -99, 1117, 63)]);
  S(5, [R(1117, -99, 1235, 63)]);
  S(0, [R(888, 63, 1117, 382)]);
  S(1, [R(1117, 63, 1235, 382)]);
  S(2, [R(1235, -99, 1400, 117)]);
  S(5, [R(1235, 117, 1400, 382)]);
  S(3, [R(888, 382, 1123, 425)]);
  S(2, [R(1123, 382, 1400, 425)]);
  S(4, [R(888, 425, 1125, 494)]);
  S(5, [R(1125, 425, 1400, 583)]);
  S(4, [R(791, 480, 982, 714)]);
  S(2, [R(791, 714, 990, 802)]);
  S(3, [R(791, 802, 990, 1100)]);
  S(0, [R(791, 714, 990, 802), IN(C6)]);
  S(5, [R(791, 802, 990, 1100), IN(C6)]);
  S(5, [R(990, 747, 1400, 1100)]);
  S(0, [R(1130, 583, 1400, 747)]);
  S(1, [R(1130, 583, 1400, 747), IN(C7)]);
  // --- stairs
  S(3, [R(982, 494, 1127, 614)]);
  S(2, [R(982, 614, 1130, 651)]);
  S(3, [R(984, 651, 1132, 697)]);
  S(1, [R(986, 697, 1134, 748)]);
  S(3, [R(987, 748, 1135, 807)]);
  // --- right circle family
  S(4, [IN(C2c), R(1117, 63, 1235, 382)]);
  S(3, [IN(C2o), R(888, -99, 1117, 382)]);
  S(1, [IN(C2), R(785, -99, 888, 700)]);
  S(4, [IN(C2), R(888, -99, 1117, 382)]);
  S(5, [IN(C2), R(888, 382, 1117, 700)]);
  return s;
})();

// Rasterise the pattern into an RGBA map (R = id, G/B = pane centre, A = palette slot).
function buildPatternMap() {
  const W = 2048, H = Math.round(W * BOUNDS.h / BOUNDS.w);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(W / BOUNDS.w, 0, 0, H / BOUNDS.h, -BOUNDS.x * W / BOUNDS.w, -BOUNDS.y * H / BOUNDS.h);
  const BIG = 1e4, keyToId = new Map();
  PATTERN.forEach((shape, i) => {
    const rgb = [i + 1, (i * 37 + 11) % 256, (i * 91 + 53) % 256];
    keyToId.set(rgb[0] << 16 | rgb[1] << 8 | rgb[2], i + 1);
    ctx.fillStyle = `rgb(${rgb})`;
    for (const part of shape.parts) {
      ctx.save();
      for (const [kind, ...a] of part) {
        const p = new Path2D();
        if (kind === 'r') p.rect(a[0], a[1], a[2] - a[0], a[3] - a[1]);
        else if (kind === 'p') { const q = a[0]; p.moveTo(q[0], q[1]); for (let k = 2; k < q.length; k += 2) p.lineTo(q[k], q[k + 1]); p.closePath(); }
        else { if (kind === 'o') p.rect(-BIG, -BIG, 2 * BIG, 2 * BIG); p.arc(a[0], a[1], a[2], 0, Math.PI * 2); }
        ctx.clip(p, kind === 'o' ? 'evenodd' : 'nonzero');
      }
      ctx.fillRect(-BIG, -BIG, 2 * BIG, 2 * BIG);
      ctx.restore();
    }
  });
  // Anti-aliased edge pixels have blended colours: give them their neighbour's id.
  const src = ctx.getImageData(0, 0, W, H).data, ids = new Uint8Array(W * H);
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++)
    ids[i] = keyToId.get(src[i * 4] << 16 | src[i * 4 + 1] << 8 | src[i * 4 + 2]) || (x ? ids[i - 1] : y ? ids[i - W] : 1);
  return packMap(ids, W, H, PATTERN.length, id => PATTERN[id - 1].slot);
}

// ids (1..count per pixel, top-down rows) -> RGBA map texture data
function packMap(ids, W, H, count, slotOf) {
  const n = count + 1;
  const bx0 = new Float32Array(n).fill(W), by0 = new Float32Array(n).fill(H), bx1 = new Float32Array(n), by1 = new Float32Array(n);
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
    const id = ids[i];
    if (x < bx0[id]) bx0[id] = x; if (x > bx1[id]) bx1[id] = x;
    if (y < by0[id]) by0[id] = y; if (y > by1[id]) by1[id] = y;
  }
  const out = new Uint8Array(W * H * 4);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const id = ids[y * W + x], o = ((H - 1 - y) * W + x) * 4; // bottom-up rows for GL
    out[o] = id;
    out[o + 1] = Math.round((bx0[id] + bx1[id]) / 2 / W * 255);
    out[o + 2] = Math.round((1 - (by0[id] + by1[id]) / 2 / H) * 255);
    out[o + 3] = slotOf(id) * 40;
  }
  return { data: out, W, H, aspect: W / H, panes: count };
}

// =====================================================================================
// Designer patterns: any SVG works. We ignore fills and colours and look only at the
// LINES — every outline is drawn as a thin stroke, and each closed region between the
// lines becomes one pane. So a pattern can be a single <path> of crack lines, or a
// drawing made of many shapes; both give the same result.
// =====================================================================================
const MAX_PANES = 255, MIN_PANE_AREA = 60;
async function buildSvgPatternMap(text) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svg = doc.documentElement;
  if (svg.nodeName !== 'svg' || doc.querySelector('parsererror')) throw new Error('Not a valid SVG file');
  let vb = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  if (vb.length !== 4 || vb.some(isNaN)) {
    vb = [0, 0, parseFloat(svg.getAttribute('width')), parseFloat(svg.getAttribute('height'))];
    if (!(vb[2] > 0 && vb[3] > 0)) throw new Error('SVG needs a viewBox (or width and height)');
    svg.setAttribute('viewBox', vb.join(' '));
  }
  const W = 2048, H = Math.max(64, Math.min(4096, Math.round(W * vb[3] / vb[2])));
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('preserveAspectRatio', 'none');
  const style = doc.createElementNS('http://www.w3.org/2000/svg', 'style');
  style.textContent = '*{fill:none!important;stroke:#000!important;stroke-width:2.5px!important;stroke-opacity:1!important;' +
    'opacity:1!important;stroke-dasharray:none!important;filter:none!important;mask:none!important;clip-path:none!important;' +
    'vector-effect:non-scaling-stroke!important;visibility:visible!important}';
  svg.append(style);
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
  const img = new Image();
  try {
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('Could not render this SVG')); img.src = url; });
  } finally { URL.revokeObjectURL(url); }
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, 0, 0, W, H);
  const px = ctx.getImageData(0, 0, W, H).data, N = W * H;

  // label connected regions between the lines (flood fill, 4-connected)
  const label = new Int32Array(N), stack = new Int32Array(N), areas = [0];
  for (let i = 0; i < N; i++) if (px[i * 4] < 150) label[i] = -1; // on a line
  for (let start = 0; start < N; start++) {
    if (label[start] !== 0) continue;
    const id = areas.length; let top = 0, area = 0;
    stack[top++] = start; label[start] = id;
    while (top) {
      const i = stack[--top], x = i % W; area++;
      if (x > 0 && label[i - 1] === 0) { label[i - 1] = id; stack[top++] = i - 1; }
      if (x < W - 1 && label[i + 1] === 0) { label[i + 1] = id; stack[top++] = i + 1; }
      if (i >= W && label[i - W] === 0) { label[i - W] = id; stack[top++] = i - W; }
      if (i < N - W && label[i + W] === 0) { label[i + W] = id; stack[top++] = i + W; }
    }
    areas.push(area);
  }
  // keep the biggest regions (ids must fit in a byte); specks are absorbed by their neighbours
  const keep = areas.map((a, id) => [a, id]).slice(1).filter(e => e[0] >= MIN_PANE_AREA).sort((p, q) => q[0] - p[0]).slice(0, MAX_PANES);
  if (keep.length < 2) throw new Error('No closed regions found — the lines need to enclose areas');
  const remap = new Int32Array(areas.length);
  keep.forEach(([, id], k) => { remap[id] = k + 1; });
  const ids = new Uint8Array(N), queue = stack; let qh = 0, qt = 0;
  for (let i = 0; i < N; i++) { const l = label[i] > 0 ? remap[label[i]] : 0; ids[i] = l; if (l) queue[qt++] = i; }
  // grow panes over the line pixels (and dropped specks) so every pixel has an owner
  while (qh < qt) {
    const i = queue[qh++], x = i % W, id = ids[i];
    if (x > 0 && !ids[i - 1]) { ids[i - 1] = id; queue[qt++] = i - 1; }
    if (x < W - 1 && !ids[i + 1]) { ids[i + 1] = id; queue[qt++] = i + 1; }
    if (i >= W && !ids[i - W]) { ids[i - W] = id; queue[qt++] = i - W; }
    if (i < N - W && !ids[i + W]) { ids[i + W] = id; queue[qt++] = i + W; }
  }
  return packMap(ids, W, H, keep.length, id => (id * 5 + 2) % 6);
}

// Patterns shipped with the page: add an SVG to patterns/ and list it here.
const PATTERN_LIBRARY = [
  { name: 'Portrait 4:5', url: 'patterns/portrait.svg' },
  { name: 'Facets (example)', url: 'patterns/facets.svg' },
];

// =====================================================================================
// Palettes — six colours each, in slot order (dark cool, mid cool, dark warm, mid warm, light, neutral)
// =====================================================================================
const PALETTES = {
  'None (original)': null,
  'Mural':   ['#1f3a5a', '#4f7a9c', '#4a2f26', '#8a4a33', '#e3d2bd', '#9a9a98'],
  'Bauhaus': ['#1d3557', '#2a6fb0', '#1a1a1a', '#d62828', '#f6c945', '#efe9dc'],
  'Sunset':  ['#2d1b4e', '#6a3d9a', '#b0304f', '#f26a4b', '#ffd27a', '#f7a072'],
  'Forest':  ['#12372a', '#436850', '#5b4636', '#a47148', '#f1e8cf', '#adbc9f'],
  'Ocean':   ['#0a2540', '#1f6f8b', '#073b3a', '#2aa198', '#e0f4f1', '#99c1de'],
  'Pastel':  ['#7d9bd1', '#a8d5e2', '#c79bd0', '#f6a6b2', '#fdf0d5', '#c9e4c5'],
  'Neon':    ['#0b0f3b', '#00c2ff', '#5a00d6', '#ff2e93', '#e9ff4d', '#2af5b0'],
};

const GLASS = [ // id, label, min, max, step, default
  ['patScale', 'Pattern scale',   1, 3, 0.01, 1],
  ['disp',     'Displacement',    0, 0.6, 0.005, 0.22],
  ['zoomVar',  'Magnification',   0, 1.2, 0.01, 0.5],
  ['rot',      'Twist',           0, 0.6, 0.005, 0.06],
  ['zoom',     'Image zoom',      0.6, 3, 0.01, 1.4],
  ['edge',     'Edge highlights', 0, 1, 0.01, 0.5],
  ['tint',     'Glass tint',      0, 0.5, 0.01, 0.14],
  ['grain',    'Grain',           0, 0.6, 0.01, 0.22],
];
const COLOR = [['color', 'Color strength', 0, 1, 0.01, 0.85]];
const MAX_SIDE = 2400;
const $ = id => document.getElementById(id);
const query = new URLSearchParams(location.search); // any control can be preset, e.g. ?palette=Mural&disp=0.1
const params = {};
let seed = 1, colorOrder = [0, 1, 2, 3, 4, 5], hasImage = false, raf = 0;

// ---- controls
const sliders = [];
function addSliders(list, host) {
  for (const [id, label, min, max, step, def] of list) {
    const val = query.has(id) ? +query.get(id) : def;
    params[id] = val;
    const row = document.createElement('label');
    row.className = 'row';
    row.innerHTML = `<span>${label}</span><output>${val}</output><input type="range" min="${min}" max="${max}" step="${step}" value="${val}">`;
    row.querySelector('input').addEventListener('input', e => {
      params[id] = +e.target.value;
      row.querySelector('output').textContent = e.target.value;
      schedule();
    });
    sliders.push(row.querySelector('input'));
    host.append(row);
  }
}
addSliders(GLASS, $('glassControls'));
addSliders(COLOR, $('colorControls'));
for (const name of Object.keys(PALETTES)) $('palette').add(new Option(name, name));
$('palette').value = PALETTES[query.get('palette')] !== undefined ? query.get('palette') : 'None (original)';
if (query.has('fit')) $('fit').value = query.get('fit');
if (query.has('mono')) $('mono').checked = query.get('mono') !== '0';
function currentPalette() {
  const p = PALETTES[$('palette').value];
  return p && colorOrder.map(i => p[i]);
}
function updateSwatches() {
  $('swatches').innerHTML = (currentPalette() || []).map(c => `<i style="background:${c}"></i>`).join('');
}
updateSwatches();
$('palette').addEventListener('change', () => { updateSwatches(); schedule(); });
$('fit').addEventListener('change', schedule);
$('mono').addEventListener('change', schedule);
$('shuffle').addEventListener('click', () => { seed = 1 + Math.floor(Math.random() * 1e6); schedule(); });
$('shuffleColors').addEventListener('click', () => {
  for (let i = 5; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [colorOrder[i], colorOrder[j]] = [colorOrder[j], colorOrder[i]]; }
  updateSwatches(); schedule();
});
$('reset').addEventListener('click', () => {
  // zero everything; the two zoom sliders can't reach 0, so they go to their neutral 1
  for (const el of sliders) { el.value = +el.min > 0 ? 1 : 0; el.dispatchEvent(new Event('input')); }
});
$('open').addEventListener('click', () => $('file').click());
$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => loadFile(e.target.files[0]));
$('save').addEventListener('click', () => {
  render();
  canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'shardwork.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
});

// ---- image input: drop / paste / picker
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  const files = [...e.dataTransfer.files], isSvg = f => f.type === 'image/svg+xml' || /\.svg$/i.test(f.name);
  loadPatternFile(files.find(isSvg));
  loadFile(files.find(f => f.type.startsWith('image/') && !isSvg(f)));
});
addEventListener('paste', e => {
  loadFile([...e.clipboardData.files].find(f => f.type.startsWith('image/')));
});
function loadFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  loadUrl(url).finally(() => URL.revokeObjectURL(url));
}
function loadUrl(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { setImage(img); res(); };
    img.onerror = rej;
    img.src = url;
  });
}

// ---- WebGL
const canvas = $('gl');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
if (!gl) $('drop').innerHTML = '<strong>WebGL is not available in this browser</strong>';
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER,
  'attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }'));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, $('fs').textContent));
gl.bindAttribLocation(prog, 0, 'p');
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = name => gl.getUniformLocation(prog, name);
function makeTexture(unit, filter) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],
                        [gl.TEXTURE_MIN_FILTER, filter], [gl.TEXTURE_MAG_FILTER, filter]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
}
makeTexture(1, gl.NEAREST);
makeTexture(0, gl.LINEAR);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
let map = null; // the pattern in use
function usePattern(m) {
  map = m;
  gl.activeTexture(gl.TEXTURE1);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); // map rows are already bottom-up
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, m.W, m.H, 0, gl.RGBA, gl.UNSIGNED_BYTE, m.data);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.activeTexture(gl.TEXTURE0);
  schedule();
}

// ---- pattern picker: built-in mural, library files, and SVGs loaded at runtime
const patterns = { mural: { name: 'Mural', build: async () => buildPatternMap() } };
PATTERN_LIBRARY.forEach((p, i) => {
  patterns['lib' + i] = { name: p.name, build: async () => {
    const r = await fetch(p.url).catch(() => null);
    if (!r || !r.ok) throw new Error(location.protocol === 'file:' ? 'Library patterns need the page served over http — or use "Load pattern SVG"' : 'Could not load ' + p.url);
    return buildSvgPatternMap(await r.text());
  } };
});
function patternStatus(msg, error) { $('patternStatus').textContent = msg; $('patternStatus').classList.toggle('error', !!error); }
async function selectPattern(key) {
  const p = patterns[key];
  try {
    p.map = p.map || await p.build();
    $('pattern').value = key;
    patternStatus(p.map.panes + ' panes');
    usePattern(p.map);
  } catch (e) {
    patternStatus(e.message, true);
    if (map) $('pattern').value = Object.keys(patterns).find(k => patterns[k].map === map);
  }
}
async function loadPatternFile(file) {
  if (!file) return;
  try {
    const m = await buildSvgPatternMap(await file.text());
    const key = 'file' + Object.keys(patterns).length, name = file.name.replace(/\.svg$/i, '');
    patterns[key] = { name, map: m };
    $('pattern').add(new Option(name, key));
    selectPattern(key);
  } catch (e) { patternStatus(file.name + ': ' + e.message, true); }
}
for (const [key, p] of Object.entries(patterns)) $('pattern').add(new Option(p.name, key));
$('pattern').addEventListener('change', e => selectPattern(e.target.value));
$('loadPattern').addEventListener('click', () => $('patternFile').click());
$('patternFile').addEventListener('change', e => { loadPatternFile(e.target.files[0]); e.target.value = ''; });
selectPattern(Object.keys(patterns).find(k => patterns[k].name === query.get('pattern')) || 'mural');
gl.uniform1i(U('uTex'), 0);
gl.uniform1i(U('uMap'), 1);

function setImage(img) {
  const s = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  // go through a 2D canvas so huge images are downscaled and transparency is flattened to white
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const c2 = tmp.getContext('2d');
  c2.fillStyle = '#fff'; c2.fillRect(0, 0, w, h);
  c2.drawImage(img, 0, 0, w, h);
  canvas.width = w; canvas.height = h;
  gl.viewport(0, 0, w, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, tmp);
  hasImage = true;
  document.body.classList.add('has-image');
  $('save').disabled = false;
  render();
}

function render() {
  if (!hasImage || !map) return;
  const aspect = canvas.width / canvas.height, pa = map.aspect;
  // canvas uv -> pattern uv: "cover" keeps the shapes' proportions and crops, "stretch" shows it all
  let fx = 1, fy = 1;
  if ($('fit').value === 'cover') { if (aspect < pa) fx = aspect / pa; else fy = pa / aspect; }
  gl.uniform2f(U('uFit'), fx / params.patScale, fy / params.patScale);
  gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  gl.uniform1f(U('uAspect'), aspect);
  gl.uniform1f(U('uSeed'), (seed % 1000) / 10);
  for (const k of ['disp', 'zoomVar', 'rot', 'zoom', 'edge', 'tint', 'grain'])
    gl.uniform1f(U('u' + k[0].toUpperCase() + k.slice(1)), params[k]);
  gl.uniform1f(U('uMono'), $('mono').checked ? 1 : 0);
  const pal = currentPalette();
  gl.uniform1f(U('uColor'), pal ? params.color : 0);
  if (pal) gl.uniform3fv(U('uPal[0]'), new Float32Array(pal.flatMap(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255))));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }

// optional: index.html?src=photo.jpg when served over http
if (query.get('src')) loadUrl(query.get('src')).catch(() => {});
</script>
</body>
</html>
